name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  UV_CACHE_DIR: /tmp/uv-cache
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set Package Version From Release Tag
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Invalid release version: $RELEASE_TAG" >&2
            exit 1
          fi
          sed -i.bak -E "s/^version = \"0\.0\.0\".*/version = \"$version\"/" Cargo.toml
          rm Cargo.toml.bak
          grep -q "^version = \"$version\"$" Cargo.toml

      - name: Build Wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --release
            --strip
            --interpreter ${{ matrix.os == 'windows-latest' && 'python' || format('python{0}', matrix.python-version) }}
            --compatibility pypi
          manylinux: "2_17"

      - name: Upload Wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: target/wheels/*.whl
          if-no-files-found: error

  source-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.10"

      - name: Set Package Version From Release Tag
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Invalid release version: $RELEASE_TAG" >&2
            exit 1
          fi
          sed -i.bak -E "s/^version = \"0\.0\.0\".*/version = \"$version\"/" Cargo.toml
          rm Cargo.toml.bak
          grep -q "^version = \"$version\"$" Cargo.toml

      - name: Build Source Distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist

      - name: Upload Source Distribution
        uses: actions/upload-artifact@v7
        with:
          name: source-dist
          path: target/wheels/*.tar.gz
          if-no-files-found: error

  publish:
    needs:
      - build
      - source-dist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/blake2b-py
    permissions:
      id-token: write
    steps:
      - name: Download Packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: Publish Package
        uses: pypa/gh-action-pypi-publish@release/v1
