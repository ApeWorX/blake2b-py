[package]
name = "blake2b-py"
version = "0.0.0"  # Replaced from the GitHub release tag in publish CI.
authors = [
    "David Sanders <davesque@gmail.com>",
    "ApeWorX <admin@apeworx.io>",
]
edition = "2018"
license = "MIT"
repository = "https://github.com/ApeWorX/blake2b-py"
description = "Blake2b hashing in Rust with Python bindings."

[dependencies]
pyo3 = { version = "~0.29", features = ["extension-module"] }

[dev-dependencies]
hex = "~0.4"

[features]
nightly-benches = []

[lib]
name = "blake2b"
crate-type = ["cdylib"]

[profile.dev]
overflow-checks = false

[profile.test]
overflow-checks = false
